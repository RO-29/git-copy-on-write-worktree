<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.h{font-size:17px;font-weight:600;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.lbl{font-size:12px;fill:#656d76}
.t{font-size:13px;fill:#1f2328;font-weight:600}
.cap{font-size:13px;fill:#1f2328}
.bad{fill:#cf222e}.good{fill:#1a7f37}
.file{fill:#ddf4ff;stroke:#0969da}
.blk{fill:#eaeef2;stroke:#8c959f}
.blk.new{fill:#ffebe9;stroke:#cf222e}
.ln{stroke:#8c959f;stroke-width:1.5}
.red{stroke:#cf222e}.green{stroke:#1a7f37}
.dash{stroke-dasharray:4 3}
.a{opacity:0;animation:appear 8s infinite both}
.swapin{opacity:0;animation:swapin 8s infinite both}
.swapout{opacity:0;animation:swapout 8s infinite both;animation-delay:1.2s}
@keyframes appear{0%{opacity:0}6%{opacity:1}85%{opacity:1}92%,100%{opacity:0}}
@keyframes swapin{0%,55%{opacity:0}62%{opacity:1}88%{opacity:1}95%,100%{opacity:0}}
@keyframes swapout{0%{opacity:0}6%{opacity:1}48%{opacity:1}52%,100%{opacity:0}}
</style>
