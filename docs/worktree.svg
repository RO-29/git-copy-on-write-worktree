<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
.bg{fill:#ffffff;stroke:#d0d7de}
.repo{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
.dir{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
.h{font-size:14px;font-weight:600;fill:#1f2328}
.m{font-size:12.5px;fill:#0969da;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.s{font-size:12px;fill:#656d76}
.ln{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:5 4;animation:flow 1.2s linear infinite}
.pulse{animation:pulse 6s infinite both}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes pulse{0%,30%{fill:#ddf4ff}8%,22%{fill:#b6e3ff}}
</style>
<rect x="1" y="1" width="798" height="228" rx="10" class="bg"/>
<rect x="300" y="20" width="200" height="56" rx="8" class="repo"/>
<text x="400" y="44" class="h" text-anchor="middle">one .git</text>
<text x="400" y="64" class="s" text-anchor="middle">commits, branches, objects</text>
<line x1="400" y1="76" x2="145" y2="130" class="ln"/>
<rect x="40" y="130" width="210" height="76" rx="8" class="dir pulse" style="animation-delay:0s"/>
<text x="145" y="155" class="m" text-anchor="middle">app/</text>
<text x="145" y="175" class="h" text-anchor="middle">branch main</text>
<text x="145" y="194" class="s" text-anchor="middle">your normal folder</text>
<line x1="400" y1="76" x2="395" y2="130" class="ln"/>
<rect x="290" y="130" width="210" height="76" rx="8" class="dir pulse" style="animation-delay:2s"/>
<text x="395" y="155" class="m" text-anchor="middle">app-worktrees/fix/</text>
<text x="395" y="175" class="h" text-anchor="middle">branch fix/login</text>
<text x="395" y="194" class="s" text-anchor="middle">a second folder</text>
<line x1="400" y1="76" x2="645" y2="130" class="ln"/>
<rect x="540" y="130" width="210" height="76" rx="8" class="dir pulse" style="animation-delay:4s"/>
<text x="645" y="155" class="m" text-anchor="middle">app-worktrees/review/</text>
<text x="645" y="175" class="h" text-anchor="middle">branch pr-123</text>
<text x="645" y="194" class="s" text-anchor="middle">a third folder</text>
</svg>
